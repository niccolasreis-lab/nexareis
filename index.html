<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa Reis Automation | Transforme seu Negócio</title>
    <meta name="description" content="Soluções tecnológicas que impulsionam eficiência, reduzem custos e escalam seu crescimento." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M25 80 L25 20 L75 80 L75 20' fill='none' stroke='%2300D4FF' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M50 20 L50 50 L75 50' fill='none' stroke='%2300D4FF' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      :root {
        --color-blue: #0066FF;
        --color-cyan: #00D4FF;
        --color-orange: #FF6B35;
        --color-navy: #0A1628;
        --color-slate900: #0F172A;
        --color-slate800: #1E293B;
        --color-white: #ffffff;
        --color-gray-300: #d1d5db;
        --color-gray-400: #9ca3af;
        --color-gray-500: #6b7280;
        --color-gray-600: #4b5563;
        --color-red: #ef4444;
        --color-green: #22c55e;
      }

      /* Reset & Base */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background-color: var(--color-navy);
        color: var(--color-white);
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      a { text-decoration: none; color: inherit; transition: color 0.2s; }
      ul { list-style: none; padding: 0; margin: 0; }
      button { font-family: inherit; border: none; background: none; cursor: pointer; }
      p { margin: 0; }
      h1, h2, h3, h4, h5, h6 { margin: 0; }

      /* Layout */
      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      @media (min-width: 768px) {
        .container { padding: 0 1.5rem; }
      }

      /* Utilities */
      .text-gradient {
        background: linear-gradient(135deg, var(--color-cyan) 0%, var(--color-blue) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
      }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .gap-2 { gap: 0.5rem; }
      .gap-4 { gap: 1rem; }
      .hidden { display: none; }
      @media (min-width: 768px) {
        .md-flex { display: flex; }
        .md-hidden { display: none; }
        .md-block { display: block; }
      }

      /* Components Styles */
      
      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        font-weight: 500;
        transition: all 0.3s;
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-sm { padding: 0.5rem 1rem; font-size: 0.875rem; }
      .btn-md { padding: 0.75rem 1.5rem; font-size: 1rem; }
      .btn-lg { padding: 1rem 2rem; font-size: 1.125rem; }
      
      .btn-primary {
        background: linear-gradient(to right, var(--color-blue), var(--color-cyan));
        color: white;
        box-shadow: 0 4px 6px rgba(0, 102, 255, 0.2);
      }
      .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px rgba(0, 102, 255, 0.4);
      }
      
      .btn-outline {
        background: transparent;
        border: 1px solid rgba(0, 212, 255, 0.3);
        color: var(--color-cyan);
      }
      .btn-outline:hover {
        background: rgba(0, 212, 255, 0.1);
        border-color: rgba(0, 212, 255, 0.6);
        transform: translateY(-2px);
      }

      .btn-ghost {
        background: transparent;
        color: var(--color-gray-300);
      }
      .btn-ghost:hover {
        color: white;
        background: rgba(255, 255, 255, 0.05);
      }

      /* Header */
      .header {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 50;
        transition: all 0.3s;
        border-bottom: 1px solid transparent;
        padding: 1.25rem 0;
      }
      .header.scrolled {
        background-color: rgba(10, 22, 40, 0.8);
        backdrop-filter: blur(12px);
        border-bottom-color: var(--color-slate800);
        padding: 0.75rem 0;
      }
      .nav-link {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--color-gray-300);
        transition: color 0.2s;
      }
      .nav-link:hover { color: var(--color-cyan); }
      .mobile-menu {
        background-color: var(--color-navy);
        border-bottom: 1px solid var(--color-slate800);
        overflow: hidden;
      }

      /* Logo */
      .logo-container { display: flex; }
      .logo-header { align-items: center; gap: 0.75rem; }
      .logo-footer { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .logo-svg-wrapper { position: relative; transition: all 0.3s; }
      .logo-glow {
        position: absolute; inset: 0;
        background-color: rgba(0, 102, 255, 0.2);
        border-radius: 0.5rem;
        filter: blur(12px);
        transition: all 0.5s;
      }
      .logo-svg-wrapper:hover .logo-glow { background-color: rgba(0, 212, 255, 0.3); }
      .logo-text {
        font-weight: 700;
        letter-spacing: -0.025em;
        white-space: nowrap;
        background: linear-gradient(to right, var(--color-cyan), var(--color-blue));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Hero */
      .hero-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding-top: 5rem;
      }
      .hero-bg-blob-1 {
        position: absolute; top: -10%; left: -10%; width: 500px; height: 500px;
        background-color: rgba(0, 102, 255, 0.2);
        border-radius: 9999px; filter: blur(100px);
      }
      .hero-bg-blob-2 {
        position: absolute; bottom: 10%; right: -5%; width: 600px; height: 600px;
        background-color: rgba(0, 212, 255, 0.1);
        border-radius: 9999px; filter: blur(120px);
      }
      .hero-noise {
        position: absolute; inset: 0;
        background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.2; mix-blend-mode: overlay; pointer-events: none;
      }
      .hero-badge {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        background-color: rgba(0, 102, 255, 0.1);
        border: 1px solid rgba(0, 102, 255, 0.3);
        color: var(--color-cyan);
        font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;
        margin-bottom: 2rem;
      }
      .hero-title {
        font-size: 3rem;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin-bottom: 1.5rem;
      }
      @media (min-width: 768px) { .hero-title { font-size: 4.5rem; } }
      .hero-subtitle {
        font-size: 1.125rem; color: var(--color-gray-400);
        margin-bottom: 2.5rem; max-width: 42rem; margin-left: auto; margin-right: auto;
        line-height: 1.6;
      }
      .hero-actions {
        display: flex; flex-direction: column; gap: 1rem;
        align-items: center; justify-content: center;
      }
      @media (min-width: 640px) { .hero-actions { flex-direction: row; } }
      .scroll-indicator {
        position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        color: var(--color-gray-500);
      }
      .scroll-line {
        width: 1px; height: 3rem;
        background: linear-gradient(to bottom, rgba(0, 212, 255, 0.5), transparent);
      }

      /* Services & Grid Sections */
      .section-py { padding-top: 6rem; padding-bottom: 6rem; }
      .bg-navy { background-color: var(--color-navy); }
      .bg-slate900 { background-color: var(--color-slate900); }
      
      .section-header { text-align: center; margin-bottom: 5rem; max-width: 48rem; margin-left: auto; margin-right: auto; }
      .section-title { font-size: 2.25rem; font-weight: 700; margin-bottom: 1.5rem; }
      @media (min-width: 768px) { .section-title { font-size: 3rem; } }
      .section-desc { font-size: 1.125rem; color: var(--color-gray-400); }

      .grid-cards {
        display: grid; grid-template-columns: 1fr; gap: 2rem;
      }
      @media (min-width: 768px) { .grid-cards { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1024px) { .grid-cards { grid-template-columns: repeat(3, 1fr); } }

      .card-item {
        position: relative;
        background-color: rgba(30, 41, 59, 0.5);
        border: 1px solid var(--color-slate800);
        padding: 2rem; border-radius: 1rem;
        transition: all 0.3s;
      }
      .card-item:hover { border-color: rgba(0, 212, 255, 0.3); transform: translateY(-0.5rem); }
      .card-icon-box {
        width: 3.5rem; height: 3.5rem;
        background-color: var(--color-navy);
        border: 1px solid var(--color-slate800);
        border-radius: 0.75rem;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 1.5rem;
        color: var(--color-cyan);
        transition: all 0.3s;
      }
      .card-item:hover .card-icon-box {
        border-color: rgba(0, 212, 255, 0.5);
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
      }
      .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: white; transition: color 0.3s; }
      .card-item:hover .card-title { color: var(--color-cyan); }
      .card-text { color: var(--color-gray-400); line-height: 1.6; margin-bottom: 1.5rem; min-height: 5rem; }
      .card-link {
        display: inline-flex; align-items: center;
        font-weight: 600; color: var(--color-blue);
        transition: color 0.3s;
      }
      .card-item:hover .card-link { color: var(--color-cyan); }

      /* Stats */
      .stats-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem;
      }
      @media (min-width: 768px) {
        .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 1rem; }
      }
      .stat-item {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        padding: 1rem;
      }
      .stat-number {
        font-size: 3rem; font-weight: 800;
        background: linear-gradient(to right, var(--color-cyan), white);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }
      @media (min-width: 768px) { .stat-number { font-size: 3.75rem; } }
      .stat-label {
        margin-top: 1rem; color: var(--color-gray-400);
        font-weight: 500; text-transform: uppercase; font-size: 0.875rem; letter-spacing: 0.05em;
      }

      /* Value Prop Section */
      .value-box {
        background: linear-gradient(to right, rgba(0, 102, 255, 0.1), rgba(0, 212, 255, 0.05));
        border: 1px solid rgba(0, 102, 255, 0.2);
        border-radius: 1.5rem;
        padding: 2rem; text-align: center;
      }
      @media (min-width: 768px) { .value-box { padding: 4rem; } }
      .value-grid {
        display: grid; grid-template-columns: 1fr; gap: 2rem;
        margin-top: 2.5rem;
      }
      @media (min-width: 768px) { .value-grid { grid-template-columns: repeat(3, 1fr); } }
      .value-item { background-color: rgba(10, 22, 40, 0.5); padding: 1.5rem; border-radius: 0.75rem; }

      /* Contact Form */
      .contact-grid {
        display: grid; grid-template-columns: 1fr; gap: 4rem;
      }
      @media (min-width: 1024px) { .contact-grid { grid-template-columns: 1fr 1fr; } }
      .contact-info-box {
        background-color: rgba(30, 41, 59, 0.3);
        border: 1px solid var(--color-slate800);
        border-radius: 1rem; padding: 2rem; margin-bottom: 2rem;
      }
      .form-card {
        background-color: var(--color-slate900);
        border: 1px solid var(--color-slate800);
        border-radius: 1.5rem;
        padding: 2rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        position: relative; overflow: hidden;
      }
      @media (min-width: 768px) { .form-card { padding: 2.5rem; } }
      .form-grid-2 {
        display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 1.5rem;
      }
      @media (min-width: 768px) { .form-grid-2 { grid-template-columns: 1fr 1fr; } }
      .form-group { margin-bottom: 1.5rem; }
      .form-label {
        display: block; font-size: 0.875rem; font-weight: 500;
        color: var(--color-gray-300); margin-bottom: 0.5rem;
      }
      .form-input, .form-select, .form-textarea {
        width: 100%;
        background-color: var(--color-navy);
        border: 1px solid var(--color-slate800);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        color: white;
        outline: none;
        transition: all 0.2s;
        font-family: inherit; font-size: 1rem;
      }
      .form-input:focus, .form-select:focus, .form-textarea:focus {
        border-color: var(--color-blue);
        box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.2);
      }
      .error-msg {
        color: var(--color-red); font-size: 0.75rem; margin-top: 0.25rem;
        display: flex; align-items: center; gap: 0.25rem;
      }
      .success-overlay {
        position: absolute; inset: 0; z-index: 20;
        background-color: var(--color-slate900);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 2rem;
      }

      /* Footer */
      .footer {
        background-color: var(--color-slate900);
        border-top: 1px solid var(--color-slate800);
        padding-top: 4rem; padding-bottom: 2rem;
      }
      .footer-grid {
        display: grid; grid-template-columns: 1fr; gap: 3rem; margin-bottom: 3rem;
      }
      @media (min-width: 768px) { .footer-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (min-width: 1024px) { .footer-grid { grid-template-columns: repeat(4, 1fr); } }
      .footer-links li { margin-bottom: 0.75rem; }
      .footer-links a { color: var(--color-gray-400); font-size: 0.875rem; }
      .footer-links a:hover { color: var(--color-cyan); }
      .footer-social { display: flex; gap: 1rem; }
      .footer-social a { color: var(--color-gray-400); transition: color 0.2s; }
      .footer-social a:hover { color: var(--color-blue); }
      .footer-bottom {
        border-top: 1px solid var(--color-slate800);
        padding-top: 2rem;
        display: flex; flex-direction: column; align-items: center; gap: 1rem;
      }
      @media (min-width: 768px) {
        .footer-bottom { flex-direction: row; justify-content: space-between; }
      }

      /* Dev Signature */
      .dev-signature {
        width: 100%;
        border-top: 1px solid rgba(30, 41, 59, 0.5);
        margin-top: 2rem;
        padding-top: 1.5rem;
      }
      .dev-sig-content {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 0.75rem; font-size: 0.75rem; color: var(--color-gray-500);
      }
      @media (min-width: 768px) {
        .dev-sig-content { flex-direction: row; gap: 1.5rem; }
      }
      .dev-sig-link { display: flex; align-items: center; gap: 0.375rem; transition: color 0.2s; }
      .dev-sig-link:hover { color: var(--color-cyan); }
      .whatsapp-link:hover { color: var(--color-green); }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: var(--color-navy); }
      ::-webkit-scrollbar-thumb { background: var(--color-slate800); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-blue); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.26.2",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "react-hook-form": "https://esm.sh/react-hook-form@^7.71.1",
    "zod": "https://esm.sh/zod@^4.3.5",
    "@hookform/resolvers/": "https://esm.sh/@hookform/resolvers@^5.2.2/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
